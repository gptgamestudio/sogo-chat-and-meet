name: SOGO CHAT AND MEET Verification

# Verification-only workflow: never deploys to Firebase production or modifies Auth/App Check settings.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify-firebase-config:
    name: Validate Firebase JSON & Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate JSON configs
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("firebase.json", "utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("firestore.indexes.json", "utf8"))'

      - name: Install Firebase CLI and rules test dependencies
        run: |
          npm install
          npm install -g firebase-tools

      - name: Run Firestore and Storage security rules emulator tests
        run: npm run test:rules

  verify-android-build:
    name: Build Android Debug & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate ephemeral CI debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run non-emulator unit tests and assemble Debug APK
        run: gradle :app:testDebugUnitTest --tests '*AuthComponentsTest*' --tests '*ExampleUnitTest*' assembleDebug
