name: Publish SOGO Android APK Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build & Publish SOGO-CHAT-AND-MEET.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK (when release keystore secrets exist)
        if: steps.keystore.outputs.has_release == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SOGO-CHAT-AND-MEET.apk

      - name: Build Debug APK (fallback when release secrets are not configured)
        if: steps.keystore.outputs.has_release != 'true'
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk SOGO-CHAT-AND-MEET.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOGO-CHAT-AND-MEET-apk
          path: SOGO-CHAT-AND-MEET.apk
          retention-days: 30

      - name: Publish SOGO-CHAT-AND-MEET.apk to Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES="Direct Android APK download for SOGO CHAT AND MEET (com.sogo.chatandmeet, Android 7.0+ / API 24+)."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest SOGO-CHAT-AND-MEET.apk --clobber
            gh release edit latest \
              --title "SOGO CHAT AND MEET — Latest Android APK" \
              --notes "$RELEASE_NOTES"
          else
            gh release create latest SOGO-CHAT-AND-MEET.apk \
              --target "${{ github.sha }}" \
              --title "SOGO CHAT AND MEET — Latest Android APK" \
              --notes "$RELEASE_NOTES"
          fi
