name: Publish SOGO Android APK Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build & Publish SOGO-CHAT-AND-MEET.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore and verify app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys

          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          target = "app/google-services.json"

          if raw:
              if raw.startswith("{"):
                  data_text = raw
              else:
                  try:
                      data_text = base64.b64decode(raw, validate=True).decode("utf-8")
                  except Exception:
                      print("ERROR: GOOGLE_SERVICES_JSON secret is neither valid JSON nor valid Base64.", file=sys.stderr)
                      sys.exit(1)
              with open(target, "w", encoding="utf-8") as f:
                  f.write(data_text.rstrip() + "\n")
              os.chmod(target, 0o600)
              print("Restored app/google-services.json from GOOGLE_SERVICES_JSON secret.")
          elif os.path.isfile(target):
              print("Using repository app/google-services.json (GOOGLE_SERVICES_JSON secret not set).")
          else:
              print("ERROR: app/google-services.json is missing and GOOGLE_SERVICES_JSON secret is not set.", file=sys.stderr)
              sys.exit(1)

          try:
              with open(target, "r", encoding="utf-8") as f:
                  cfg = json.load(f)
          except Exception:
              print("ERROR: app/google-services.json is not valid JSON.", file=sys.stderr)
              sys.exit(1)

          project_id = cfg.get("project_info", {}).get("project_id", "")
          clients = cfg.get("client", [])
          pkg_ok = any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.sogo.chatandmeet"
              for c in clients
          )
          web_client_ok = any(
              any(o.get("client_type") == 3 for o in c.get("oauth_client", []))
              for c in clients
          )

          if not project_id:
              print("ERROR: Missing project_info.project_id in app/google-services.json.", file=sys.stderr)
              sys.exit(1)
          if not pkg_ok:
              print("ERROR: app/google-services.json does not contain package com.sogo.chatandmeet.", file=sys.stderr)
              sys.exit(1)
          if not web_client_ok:
              print("ERROR: Missing Web OAuth client (client_type 3) needed to generate default_web_client_id.", file=sys.stderr)
              sys.exit(1)

          print("Verified app/google-services.json for com.sogo.chatandmeet (Web OAuth client present).")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android Keystore
        id: keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess, sys

          debug_b64 = os.environ.get("DEBUG_KEYSTORE_BASE64", "").strip()
          release_b64 = os.environ.get("RELEASE_KEYSTORE_BASE64", "").strip()
          store_pw = os.environ.get("STORE_PASSWORD", "")
          key_pw = os.environ.get("KEY_PASSWORD", "")

          if debug_b64:
              try:
                  raw_dbg = base64.b64decode(debug_b64, validate=True)
              except Exception:
                  print("ERROR: DEBUG_KEYSTORE_BASE64 is not valid Base64.", file=sys.stderr)
                  sys.exit(1)
              with open("debug.keystore", "wb") as f:
                  f.write(raw_dbg)
              os.chmod("debug.keystore", 0o600)
              print("Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret.")
          elif not os.path.isfile("debug.keystore"):
              subprocess.run([
                  "keytool", "-genkey", "-v", "-keystore", "debug.keystore",
                  "-storepass", "android", "-alias", "androiddebugkey",
                  "-keypass", "android", "-keyalg", "RSA", "-keysize", "2048",
                  "-validity", "10000", "-dname", "CN=Android Debug,O=Android,C=US"
              ], check=True)
              print("Generated ephemeral debug.keystore (DEBUG_KEYSTORE_BASE64 secret not set).")

          has_release = False
          active_keystore = "debug.keystore"
          active_alias = "androiddebugkey"
          active_pw = "android"

          if release_b64:
              if not store_pw or not key_pw:
                  print("ERROR: RELEASE_KEYSTORE_BASE64 is set but STORE_PASSWORD or KEY_PASSWORD secret is missing.", file=sys.stderr)
                  sys.exit(1)
              try:
                  raw_rel = base64.b64decode(release_b64, validate=True)
              except Exception:
                  print("ERROR: RELEASE_KEYSTORE_BASE64 is not valid Base64.", file=sys.stderr)
                  sys.exit(1)
              with open("my-upload-key.jks", "wb") as f:
                  f.write(raw_rel)
              os.chmod("my-upload-key.jks", 0o600)
              has_release = True
              active_keystore = "my-upload-key.jks"
              active_alias = "upload"
              active_pw = store_pw
              print("Restored release keystore for signed release build.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"has_release={'true' if has_release else 'false'}\n")

          # Check active signing SHA-1 against app/google-services.json so Google Sign-In works
          kt = subprocess.run(
              ["keytool", "-list", "-v", "-keystore", active_keystore, "-storepass", active_pw, "-alias", active_alias],
              capture_output=True, text=True
          )
          m = re.search(r"SHA1:\s*([0-9A-Fa-f:]+)", kt.stdout)
          if m:
              sha1_colon = m.group(1).upper()
              sha1_hex = sha1_colon.replace(":", "").lower()
              print(f"Active APK signing SHA-1: {sha1_colon}")
              with open("app/google-services.json", "r", encoding="utf-8") as f:
                  gs = json.load(f)
              registered = {
                  o.get("android_info", {}).get("certificate_hash", "").lower()
                  for c in gs.get("client", [])
                  for o in c.get("oauth_client", [])
                  if o.get("android_info", {}).get("certificate_hash")
              }
              if sha1_hex in registered:
                  print("Signing SHA-1 is registered in app/google-services.json (Google Sign-In ready).")
              else:
                  print(
                      f"::warning::Signing SHA-1 ({sha1_colon}) is NOT in app/google-services.json! "
                      "Google Sign-In will fail with 'Sign-In was cancelled' unless you set DEBUG_KEYSTORE_BASE64 "
                      "from debug.keystore.base64 OR register this SHA-1 in Firebase Console and update GOOGLE_SERVICES_JSON."
                  )
          else:
              print("::warning::Could not inspect active keystore SHA-1 (check alias/password if release build).")
          PY

      - name: Run Android Unit Tests
        run: gradle :app:testDebugUnitTest --tests '*AuthComponentsTest*' --tests '*ExampleUnitTest*' --tests 'com.example.ads.AdMobManagerTest' --tests 'com.example.RegressionRepairsTest'

      - name: Build Signed Release APK (when release keystore secrets exist)
        if: steps.keystore.outputs.has_release == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SOGO-CHAT-AND-MEET.apk

      - name: Build Debug APK (fallback when release secrets are not configured)
        if: steps.keystore.outputs.has_release != 'true'
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk SOGO-CHAT-AND-MEET.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOGO-CHAT-AND-MEET-apk
          path: SOGO-CHAT-AND-MEET.apk
          retention-days: 30

      - name: Publish SOGO-CHAT-AND-MEET.apk to Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES="Direct Android APK download for SOGO CHAT AND MEET (com.sogo.chatandmeet, Android 7.0+ / API 24+)."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest SOGO-CHAT-AND-MEET.apk --clobber
            gh release edit latest \
              --title "SOGO CHAT AND MEET — Latest Android APK" \
              --notes "$RELEASE_NOTES"
          else
            gh release create latest SOGO-CHAT-AND-MEET.apk \
              --target "${{ github.sha }}" \
              --title "SOGO CHAT AND MEET — Latest Android APK" \
              --notes "$RELEASE_NOTES"
          fi
